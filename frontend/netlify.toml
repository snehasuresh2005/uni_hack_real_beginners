[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api calls directly to the Render backend service
[[redirects]]
  from = "/api/*"
  to = "https://unihack-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
